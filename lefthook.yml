pre-commit:
  parallel: true
  commands:
    cargo_fmt:
      glob: "*.rs"
      run: cargo fmt -- --check
      stage_fixed: true
    cargo_clippy:
      glob: "*.rs"
      run: cargo clippy -- -W clippy::pedantic -W clippy::cargo -W clippy::nursery -D warnings
      stage_fixed: true

pre-push:
  commands:
    cargo_test:
      run: cargo test --workspace
    cargo_clippy:
      run: cargo clippy --workspace -- -W clippy::pedantic -D clippy::cargo -D clippy::nursery -D warnings
