pre-commit:
  parallel: true
  commands:
    cargo_fmt:
      glob: "*.rs"
      run: cargo fmt
      stage_fixed: true
    cargo_clippy:
      glob: "*.rs"
      run: cargo clippy --fix --allow-dirty -- -W clippy::pedantic -W clippy::cargo -W clippy::nursery -A warnings
      stage_fixed: true
    build:
      glob: "*.rs"
      run: cargo leptos build
pre-push:
  commands:
    cargo_test:
      run: cargo test --workspace
    cargo_fmt:
      run: cargo fmt -- --check
    cargo_clippy:
      run: cargo clippy --workspace -- -W clippy::pedantic -W clippy::cargo -W clippy::nursery -D warnings
