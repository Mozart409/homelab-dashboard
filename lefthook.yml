pre-commit:
  parallel: true
  commands:
    just-fmt:
      run: just --fmt
    keep_sorted:
      glob: "*.{nix,yml,yaml,toml,rs}"
      run: keep-sorted {staged_files}
      stage_fixed: true
    cargo_fmt:
      glob: "*.rs"
      run: cargo fmt
      stage_fixed: true
    cargo_clippy:
      glob: "*.rs"
      run: cargo clippy --fix --allow-dirty -- -W clippy::pedantic -W clippy::cargo -W clippy::nursery -D warnings
      stage_fixed: true
    build_css:
      glob: "*.{rs,css}"
      # Recompile and stage the CSS. `git add` is explicit because `stage_fixed`
      # only re-stages already-staged files, but editing only `.rs` regenerates
      # `static/dashboard.css` which wasn't staged — so it would be left behind.
      run: tailwindcss -i static/input.css -o static/dashboard.css && git add static/dashboard.css
      stage_fixed: true
    build:
      glob: "*.rs"
      run: cargo build --workspace
commit-msg:
  commands:
    cog_verify:
      run: cog verify --file {1}
pre-push:
  commands:
    cargo_test:
      run: cargo test --workspace
    cargo_fmt:
      run: cargo fmt -- --check
    cargo_clippy:
      run: cargo clippy --workspace -- -W clippy::pedantic -W clippy::cargo -W clippy::nursery -D warnings
    cargo_deny:
      run: cargo deny check
