[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.metadata.crane]
name = "homelab-dashboard"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "A homelab dashboard for monitoring services"
repository = "https://github.com/yourusername/homelab-dashboard"
readme = "README.md"
keywords = ["dashboard", "homelab", "axum", "htmx", "maud"]
categories = ["web-applications"]

[workspace.dependencies]
# HTML templating
maud = { version = "0.27", features = ["axum"] }

# Axum & tower
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "cors", "trace", "compression-gzip"] }

# Async runtime & streams
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
async-stream = "0.3"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["json","rustls",  ] }

# Error handling & tracing (per your preferences)
color-eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# IDs (per your preferences)
ulid = { version = "3", features = ["serde"] }

# Configuration
config = { version = "0.15", default-features = false, features = ["toml"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Caching
moka = { version = "0.12", features = ["future"] }

# URL encoding (search query proxying)
urlencoding = "2.1"

# Testing
http-body-util = "0.1"
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
