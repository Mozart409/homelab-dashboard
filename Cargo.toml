[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.metadata.crane]
name = "homelab-dashboard"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A homelab dashboard for monitoring services"
repository = "https://github.com/yourusername/homelab-dashboard"
readme = "README.md"
keywords = ["dashboard", "homelab", "leptos"]
categories = ["web-applications"]

[workspace.dependencies]
# Leptos ecosystem (features enabled per-crate)
leptos = { version = "0.8" }
leptos_axum = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8"

# Axum & tower
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "compression-gzip"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Error handling & tracing (per your preferences)
color-eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# IDs (per your preferences)
ulid = { version = "1", features = ["serde"] }

# Configuration
config = { version = "0.14", default-features = false, features = ["toml"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Caching
moka = { version = "0.12", features = ["future"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev.package.leptos]
opt-level = 2

# cargo-leptos configuration
[[workspace.metadata.leptos]]
# Name of the project (used for output file naming)
name = "dashboard"

# The package in the workspace that contains the server binary
bin-package = "dashboard-server"

# The package in the workspace that contains the frontend code (compiled to WASM)
lib-package = "dashboard-app"

# The site root folder for static files (JS/WASM/CSS)
site-root = "target/site"

# The site-pkg-dir is the directory in the site root where WASM and JS are placed
site-pkg-dir = "pkg"

# Assets source directory
assets-dir = "static"

# The tailwind input file
tailwind-input-file = "static/input.css"

# The tailwind config file (optional, Tailwind v4 uses CSS-based config)
# tailwind-config-file = "tailwind.config.js"

# The IP and port the server serves on
site-addr = "127.0.0.1:8000"

# The port to use for automatic reload monitoring
reload-port = 8081

# Browser to open when starting (optional)
# browserquery = "firefox"

# Enables additional file hashing for the output files
hash-files = true

# Features to use when compiling the frontend WASM
lib-features = ["hydrate"]

# Default features for library
lib-default-features = false
