# Homelab Dashboard Configuration
# Copy to config.toml and adjust values

# Server settings
listen_address = "0.0.0.0"
port = 8080 

# Web search - the header search box submits queries straight to this engine
# (the browser is redirected there; the dashboard does not proxy the search).
# type: search engine to use (currently only "searxng"; more may be added later)
# url:  base URL of your instance
[search]
type = "searxng"
url = "https://search.example.com"

# Weather - Open-Meteo (free, no API key needed)
[weather]
latitude = 52.52
longitude = 13.41
location = "Berlin"

# Hofvarpnir video archival system
[hofvarpnir]
url = "https://hofvarpnir.local"
api_key = "optional-api-key"  # If auth is enabled

# Health checks - monitor your services
[[health_checks]]
name = "Router"
url = "http://192.168.1.1"
timeout_ms = 3000

[[health_checks]]
name = "NAS"
url = "http://nas.local:5000"
timeout_ms = 5000

[[health_checks]]
name = "Pi-hole"
url = "http://pihole.local/admin"
timeout_ms = 3000
expected_status = 200

[[health_checks]]
name = "Gitea"
url = "https://git.local/api/healthz"
timeout_ms = 5000

[[health_checks]]
name = "Nextcloud"
url = "https://cloud.local/status.php"
timeout_ms = 5000

# Quick links - static shortcuts shown in the Quick Links card.
# The dashboard only links to these (they open in a new tab); it never
# contacts the URL. `icon` is optional and accepts either an inline emoji
# or an http(s) image URL (e.g. an SVG from dashboard-icons).
[[quick_links]]
name = "Grafana"
url = "https://grafana.local"
icon = "📊"

[[quick_links]]
name = "Proxmox"
url = "https://proxmox.local:8006"
icon = "🖥️"

[[quick_links]]
name = "Jellyfin"
url = "https://jellyfin.local"
icon = "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/jellyfin.svg"
