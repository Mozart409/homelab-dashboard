# Ignore merge commits in checks and bumps
ignore_merge_commits = true

# Silently ignore fixup!/squash!/amend! commits
ignore_fixup_commits = true

from_latest_tag = true
tag_prefix = "v"

# Releases are only cut from main. cog refuses to bump on any other branch.
branch_whitelist = ["main"]

# Keep Cargo.toml/Cargo.lock in sync with the version cog computes, then verify
# the build. cog stages these changes into the bump commit automatically.
# Scope `cargo set-version` to a single member (-p dashboard-server): every
# crate inherits `version.workspace = true`, so bumping one member cascades to
# [workspace.package].version and all crates. The lockfile refresh + check keep
# Cargo.lock consistent and fail fast on breakage.
pre_bump_hooks = [
    "cargo set-version -p dashboard-server {{version}}",
    "cargo update --workspace --offline",
    "cargo check",
]

# Publish the bump commit and tag once the bump succeeds locally.
post_bump_hooks = [
    "git push origin main",
    "git push origin v{{version}}",
]

[commit_types]
release = { changelog_title = "Releases" }
